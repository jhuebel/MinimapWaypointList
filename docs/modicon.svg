<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" font-family="Verdana, Arial, sans-serif">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c8fb0"/>
      <stop offset="1" stop-color="#465476"/>
    </linearGradient>
    <linearGradient id="terrain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9bd82"/>
      <stop offset="0.5" stop-color="#a4a85e"/>
      <stop offset="1" stop-color="#748038"/>
    </linearGradient>
    <clipPath id="innerClip">
      <rect x="22" y="22" width="436" height="436" rx="34"/>
    </clipPath>

    <!-- Shared marker icons (centered on origin) so the minimap pips and the
         list rows below always use exactly the same shapes. -->
    <g id="icon-tree">
      <path d="M0,-23 L11,-3 L3,-3 L13,15 L-13,15 L-3,-3 L-11,-3 Z" fill="#4aa64a"/>
      <rect x="-3" y="15" width="6" height="8" fill="#7a5230"/>
    </g>
    <g id="icon-water">
      <circle cx="0" cy="0" r="15" fill="#3f7fd6"/>
    </g>
    <g id="icon-apple">
      <circle cx="0" cy="0" r="15" fill="#d0453a"/>
      <path d="M0,-14 C2,-19 8,-19 9,-14" fill="none" stroke="#4aa64a" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- the player's own position/facing indicator, distinct from waypoint markers -->
    <g id="icon-player">
      <path d="M0,-20 L15,15 L0,5 L-15,15 Z" fill="#ffffff" stroke="#4a4a4a" stroke-width="3" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- outer frame -->
  <rect x="6" y="6" width="468" height="468" rx="46" fill="url(#frame)"/>

  <g clip-path="url(#innerClip)">
    <!-- ===== minimap section ===== -->
    <rect x="22" y="22" width="436" height="240" fill="url(#terrain)"/>
    <path d="M22 90 C70 60 110 70 130 105 C145 132 120 165 90 175 C60 185 22 175 22 175 Z" fill="#ded6a0" opacity="0.85"/>
    <ellipse cx="330" cy="70" rx="70" ry="26" fill="#e4dca8" opacity="0.55"/>
    <ellipse cx="120" cy="230" rx="80" ry="30" fill="#5c6a2f" opacity="0.45"/>
    <ellipse cx="360" cy="200" rx="70" ry="34" fill="#5c6a2f" opacity="0.4"/>

    <!-- tiny marker pips on the minimap itself - same icons as the list below -->
    <use href="#icon-water" transform="translate(175,150) scale(0.4)"/>
    <use href="#icon-tree" transform="translate(255,190) scale(0.4)"/>
    <use href="#icon-apple" transform="translate(345,150) scale(0.4)"/>

    <!-- the player, on the map alongside the waypoints -->
    <use href="#icon-player" transform="translate(240,105) rotate(20) scale(0.55)"/>

    <!-- toggle chip straddling the seam -->
    <rect x="216" y="248" width="48" height="30" rx="7" fill="#2a2521"/>
    <path d="M232 258 L248 258 L240 270 Z" fill="#e7dfce"/>

    <!-- ===== list section ===== -->
    <rect x="22" y="262" width="436" height="196" fill="#201c19"/>

    <!-- row 1: Trees -->
    <g transform="translate(46,286)">
      <use href="#icon-tree" transform="translate(17,27)"/>
      <text x="46" y="34" fill="#f0ece2" font-size="26">Trees</text>
      <text x="330" y="34" fill="#a9d3e8" font-size="24" text-anchor="end">3m</text>
      <path d="M0,-13 L12,10 L0,4 L-12,10 Z" fill="#e7dfce" transform="translate(372,27) rotate(0)"/>
    </g>

    <!-- row 2: Water -->
    <g transform="translate(46,340)">
      <use href="#icon-water" transform="translate(17,24)"/>
      <text x="46" y="32" fill="#f0ece2" font-size="26">Water</text>
      <text x="330" y="32" fill="#a9d3e8" font-size="24" text-anchor="end">31m</text>
      <path d="M0,-13 L12,10 L0,4 L-12,10 Z" fill="#e7dfce" transform="translate(369,25) rotate(-90)"/>
    </g>

    <!-- row 3: Apples -->
    <g transform="translate(46,394)">
      <use href="#icon-apple" transform="translate(18,22)"/>
      <text x="46" y="32" fill="#f0ece2" font-size="26">Apples</text>
      <text x="330" y="32" fill="#a9d3e8" font-size="24" text-anchor="end">41m</text>
      <path d="M0,-13 L12,10 L0,4 L-12,10 Z" fill="#e7dfce" transform="translate(369,23) rotate(0)"/>
    </g>
  </g>

  <rect x="6" y="6" width="468" height="468" rx="46" fill="none" stroke="#2c3650" stroke-width="6" opacity="0.55"/>
</svg>
